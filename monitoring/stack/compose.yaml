# Prometheus + Grafana + node/GPU exporters for the LTX dashboard.
# Start it with ./setup.sh: it asks for your Grafana login and writes it to .env (git-ignored).
name: ltx-monitoring

services:
  node-exporter:            # RAM / unified memory panels
    image: prom/node-exporter:latest
    container_name: ltx-node-exporter
    restart: unless-stopped
    network_mode: host      # listens on :9100 on the host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.loadavg'

  dcgm-exporter:            # GPU utilization / power / temperature panels
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: ltx-dcgm-exporter
    restart: unless-stopped
    gpus: all
    cap_add:
      - SYS_ADMIN

  prometheus:
    image: prom/prometheus:latest
    container_name: ltx-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    extra_hosts:
      - host.docker.internal:host-gateway   # reaches ltx_exporter (:9092) and node-exporter (:9100) on the host
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: ltx-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Required, no default: ./setup.sh asks for it and stores it in .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in monitoring/stack/.env (run ./setup.sh)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana-dashboard.json:/var/lib/grafana/dashboards/ltx-video.json:ro

volumes:
  prometheus-data:
  grafana-data:
