global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ltx                       # monitoring/ltx_exporter.py (systemd user service, see setup-services.sh)
    static_configs:
      - targets: [host.docker.internal:9092]
        labels: {service: ltx}

  - job_name: node
    static_configs:
      - targets: [host.docker.internal:9100]
        labels: {service: system}

  - job_name: dcgm-exporter
    static_configs:
      - targets: [dcgm-exporter:9400]
        labels: {service: gpu}

  # Optional: feeds the dashboard's "LLM server (:8004)" tile if a vLLM server shares the box.
  # - job_name: vllm
  #   static_configs:
  #     - targets: [host.docker.internal:8004]
